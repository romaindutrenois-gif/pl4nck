id: black-scholes-european
name: Black-Scholes — European option
family: option-pricing
archetype: reference-anchored          # a known-correct value exists (closed form)
status: implemented
summary: >
  Closed-form price of a European call/put under Black-Scholes-Merton. The
  canonical reference-anchored pricing model; validated against its own closed
  form, put-call parity, and analytical Greeks.

inputs:
  - { name: S0,    type: float, description: Spot price }
  - { name: K,     type: float, description: Strike }
  - { name: r,     type: float, description: Risk-free rate (continuous) }
  - { name: sigma, type: float, description: Volatility }
  - { name: T,     type: float, description: Maturity in years }
outputs:
  - { name: price,  type: float, description: Option price }
  - { name: greeks, type: map,   description: "Delta, gamma, vega, theta, rho" }

assumptions:
  - Constant volatility and interest rate.
  - Log-normal underlying, no dividends (or continuous dividend yield).
  - Frictionless market, continuous hedging.

references:
  - { type: doi, id: 10.1086/260062,  citation: "Black & Scholes (1973), The Pricing of Options and Corporate Liabilities, JPE." }
  - { type: doi, id: 10.2307/3003143, citation: "Merton (1973), Theory of Rational Option Pricing, Bell J. Econ." }

tests:
  - id: put-call-parity
    name: Put-call parity
    checks: C - P equals S0 - K*exp(-rT) across the grid.
    nature: analytical
    criterion: "|(C - P) - (S0 - K*exp(-rT))| < 1e-10"
  - id: repricing-error
    name: Repricing vs reference
    checks: Model price matches the closed form (or a high-precision MC) within tolerance.
    nature: analytical
    criterion: "relative error < 1e-8 vs closed form"
  - id: greeks-consistency
    name: Greeks consistency
    checks: Analytical Greeks match central finite differences of the price.
    nature: analytical
    criterion: "max relative error < 1e-4"
  - id: boundary-conditions
    name: Boundary conditions
    checks: Deep ITM/OTM and T->0 limits behave correctly (payoff, intrinsic value).
    nature: analytical
    criterion: "all boundary limits hold within 1e-8"

regulatory_refs: [sr11-7-conceptual-soundness, sr11-7-outcomes-analysis]
notes: Reuses the engine's existing reference-anchored core (closed form + MC cross-check).
